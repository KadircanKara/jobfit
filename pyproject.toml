[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunt"
version = "0.2.0"
description = "Local CLI job sourcing and application tracking"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["jobhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments as call-valued defaults. That is the framework's
# interface, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Endpoint URLs and generated DDL do not wrap usefully.
"scripts/probe_sources.py" = ["E501"]
"scripts/probe_discovery_yield.py" = ["E501"]
"jobhunt/db/migrations/versions/*.py" = ["E501"]
