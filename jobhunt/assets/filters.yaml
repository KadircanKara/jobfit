# Deterministic filter, stage 1 of ranking. PLAN.md section 7.
#
# This file is yours to tune. `jobhunt init` copies it to ~/.jobhunt/filters.yaml
# and never overwrites it afterwards, so edits survive upgrades.
#
# Every rule here is free and runs on every job. The point is to kill the
# obvious misses before anything expensive looks at them.

profiles:
  yc:
    # Unpaid work only. Internships are a seniority decision, made by the
    # experience floor: banning the phrase overrode that floor before seniority
    # was ever consulted, and dropped every paid internship with it.
    hard_excludes: ["unpaid", "equity only"]
    seniority_min: mid
    boost:
      recent_batch: 1.3          # last 4 batches
      founding_engineer: 1.4
      tag_ai: 1.2
    llm_gate_prompt: prompts/yc_fit.md
    min_score_to_surface: 0.65

  global_remote:
    hard_requires:
      remote_type: [remote, hybrid]
    hard_excludes:
      - "US only"
      - "must reside in"
      - "must be located in"
      - "W2"
      - "EST overlap required"
      - "authorized to work in the United States"
    timezone:
      base: "Europe/Istanbul"
      min_overlap_hours: 4
    seniority_min: mid
    llm_gate_prompt: prompts/remote_fit.md
    min_score_to_surface: 0.7

  tr_local:
    hard_requires:
      country: [TR]
    hard_excludes: ["yarı zamanlı", "part time", "çağrı merkezi"]
    seniority_min: mid
    llm_gate_prompt: prompts/tr_fit.md
    min_score_to_surface: 0.6

  upwork:
    # No hard_requires, no seniority: a gig has no country or employment type
    # worth filtering on, and Upwork's entry/intermediate/expert levels rate
    # the contract's difficulty, not a career stage.
    #
    # The title filter is ".*" on purpose, and it has to be stated: without it
    # the global engineer/developer pattern below applies and empties the
    # market. Upwork already matched the fetch query against the whole posting
    # server-side, so re-filtering on the title here could only subtract.
    require_titles_regex: [".*"]
    llm_gate_prompt: prompts/gate_upwork.md
    min_score_to_surface: 0.6

global:
  # At least one of these must match the title. Without it, stage 1 hands the
  # gate telehealth doctors and construction estimators, and each one costs a
  # gate call to reject something a regex settles for free. Widen it freely:
  # a job wrongly dropped here is never seen again.
  require_titles_regex:
    - "(?i)engineer|developer|programmer|architect|scientist"
    - "(?i)\\b(sre|devops|mlops|backend|back-end|fullstack|full-stack|platform|infra)\\b"
    - "(?i)yazılım|yazilim|geliştirici|gelistirici|mühendis|muhendis"
    - "(?i)\\bcto\\b|head of engineering|engineering manager|tech lead"

  max_age_days: 30
  exclude_companies: []          # your own blocklist, by name
  exclude_titles_regex: ["(?i)sales|recruiter|account executive"]
